name: Build signed Android release APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  release-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Create one-run signing key
        shell: bash
        run: |
          set -euo pipefail
          KEY_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$KEY_PASSWORD"
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/pacific-release.jks" \
            -storepass "$KEY_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -alias pacific-release \
            -keyalg RSA -keysize 3072 -validity 10000 \
            -dname "CN=Pacific Offline, O=Pacific, L=Frankfurt, ST=Hesse, C=DE"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/pacific-release.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=pacific-release" >> "$GITHUB_ENV"
      - name: Build signed release APK
        run: ./android/gradlew -p android assembleRelease
      - name: Verify APK signature
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose android/app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PacificOffline-release-signed
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish APK release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pacific-apk-${{ github.run_number }}
          name: Pacific Offline APK build ${{ github.run_number }}
          body: |
            Signed release APK built by GitHub Actions.
            The signing key is generated for this build; installing a later build requires uninstalling this APK first.
          prerelease: true
          files: android/app/build/outputs/apk/release/app-release.apk
