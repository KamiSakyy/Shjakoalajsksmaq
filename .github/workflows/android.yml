name: Android APK — Ranobe EPUB

on:
  push:
    branches: [ main, "arena/**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Unit tests + assemble APK (debug & unsigned release)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages (ubuntu-latest already ships the SDK)
        run: |
          set -e
          echo "ANDROID_HOME=${ANDROID_HOME:-unset} ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          SM="$(command -v sdkmanager || true)"
          if [ -z "$SM" ] && [ -n "${ANDROID_HOME:-}" ]; then
            SM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "sdkmanager: ${SM:-not found}"
          if [ -n "$SM" ] && [ -x "$SM" ]; then
            yes | "$SM" --licenses > /dev/null 2>&1 || true
            "$SM" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools" || echo "WARN: sdkmanager failed; relying on preinstalled SDK"
          else
            echo "WARN: sdkmanager not available; relying on preinstalled SDK"
          fi
          echo "platforms:" && ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platforms" || true

      - name: Set up Gradle with dependency cache
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run unit tests
        run: |
          set +e
          ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace > test.log 2>&1
          CODE=$?
          if [ $CODE -ne 0 ]; then
            echo "----- gradle output tail -----"
            tail -120 test.log
            echo "----- error annotations -----"
            grep -m 24 -E "error:|error |FAILED|What went wrong|Caused by|Execution failed|Compilation failed|Exception" test.log | sed 's/%/%25/g; s/\r//g' | sed 's/^/::error::/' 
            exit $CODE
          fi

      - name: Upload test reports when tests fail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/**
            app/build/test-results/testDebugUnitTest/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Assemble debug APK (installable, auto debug-key, arm64-v8a only)
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Assemble release APK (arm64-v8a only, ProGuard-minified, UNSIGNED — без подписи)
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Collect APKs into dist/
        run: |
          set -e
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-arm64-v8a-debug.apk "dist/RanobeEPUB-1.0.0-debug-arm64.apk"
          cp app/build/outputs/apk/release/app-arm64-v8a-release-unsigned.apk "dist/RanobeEPUB-1.0.0-release-arm64-unsigned.apk"
          ls -la dist/

      - name: Publish clean release APK into handoff/ (this branch only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/arena/01578332-shjakoalajsksmaq'
        run: |
          set -e
          mkdir -p handoff
          cp app/build/outputs/apk/release/app-arm64-v8a-release-unsigned.apk              "handoff/RanobeEPUB-1.0.0-release-arm64-unsigned.apk"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add handoff/RanobeEPUB-1.0.0-release-arm64-unsigned.apk
          if git diff --cached --quiet; then
            echo "handoff APK unchanged — nothing to commit"
            exit 0
          fi
          git commit -m "CI handoff: ARM64 release APK, ProGuard-minified [skip ci]"
          git push origin "HEAD:refs/heads/${{ github.ref_name }}"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RanobeEPUB-apk
          path: dist/*.apk
          retention-days: 30
          if-no-files-found: error

  release:
    name: Attach APKs to GitHub Release (tags v*)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          name: RanobeEPUB-apk
          path: dist

      - name: Create GitHub Release with APK files
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          body: |
            Ranobe EPUB — полностью локальный редактор EPUB 3 для японских ранобэ.
            Сборка без подписи (по запросу). Для установки возьмите `*-debug.apk`
            или подпишите release-версию своим ключом.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  latest-release:
    name: Rolling "latest" release with APKs (main branch)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          name: RanobeEPUB-apk
          path: dist

      - name: Publish rolling latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Ranobe EPUB — latest build
          body: |
            Автоматическая rolling-сборка с ветки `main`. Подпись отсутствует (по запросу).
            Установка: скачайте `RanobeEPUB-*-debug.apk` и разрешите установку из неизвестных источников.
            После тегов (`git tag v1.0.0 && git push origin v1.0.0`) APK прикрепляется к версионному релизу.
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
