name: Build Taisei Android APK

on:
  push:
    branches:
      - main
      - 'arena/**'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build cmake pkg-config \
            python3 python3-pip python3-zstandard \
            glslang-tools spirv-tools \
            zip unzip
          python3 -m pip install --break-system-packages 'meson>=1.8.0' zstandard
          meson --version

      - name: Build Taisei native arm64-v8a libraries & assets
        shell: bash
        run: |
          set -o pipefail
          chmod +x scripts/build-android.sh
          if ! ./scripts/build-android.sh 2>&1 | tee build.log; then
            tail -n 30 build.log | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi

      - name: Build Android APK (debug)
        working-directory: android
        shell: bash
        run: |
          set -o pipefail
          if ! gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee gradle.log; then
            tail -n 35 gradle.log | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk taisei-v1.4.6-android-arm64-debug.apk
          ls -lh taisei-v1.4.6-android-arm64-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: taisei-android-apk
          path: taisei-v1.4.6-android-arm64-debug.apk
          retention-days: 30
