name: Download supplied site and build signed offline Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'scripts/build-site-from-download.py'
      - '.github/workflows/build-railway-site-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download and bundle the exact supplied website
        env:
          SOURCE_URL: https://profound-commitment-production-93d43680.up.railway.app/download/fe728cd274869ee8fdefd8341ff52a1c5b04a5e469ad9284
        shell: bash
        run: |
          set +e
          python3 scripts/build-site-from-download.py 2>&1 | tee "$RUNNER_TEMP/site-build.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            detail="$(tail -n 8 "$RUNNER_TEMP/site-build.log" | python3 -c 'import sys; print(sys.stdin.read().replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))')"
            echo "::error title=Website download/build failed::$detail"
            { echo '### Website download/build failed'; tail -n 30 "$RUNNER_TEMP/site-build.log"; } >> "$GITHUB_STEP_SUMMARY"
            exit "$status"
          fi
      - name: Generate one-run APK signing key
        shell: bash
        run: |
          set -euo pipefail
          KEY_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$KEY_PASSWORD"
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/offline-site-release.jks" \
            -storepass "$KEY_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -alias offline-site \
            -keyalg RSA -keysize 3072 -validity 10000 \
            -dname "CN=Offline Site App, O=Offline Site, C=DE"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/offline-site-release.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=offline-site" >> "$GITHUB_ENV"
      - name: Build signed release APK
        run: ./android/gradlew -p android assembleRelease
      - name: Verify APK signature
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose android/app/build/outputs/apk/release/app-release.apk
      - name: Verify bundled offline app files
        shell: bash
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          unzip -Z1 "$APK" > "$RUNNER_TEMP/apk-files.txt"
          staged_count="$(find android/app/src/main/assets/www -type f | wc -l)"
          staged_next="$(find android/app/src/main/assets/www/_next -type f 2>/dev/null | head -n 20 | sed 's#^android/app/src/main/assets/www/##' | paste -sd ',' - || true)"
          echo "::notice title=APK website assets::staged_files=$staged_count; staged_next=${staged_next:-none}"
          embedded="$(grep '^assets/www/' "$RUNNER_TEMP/apk-files.txt" | head -n 40 | paste -sd ',' - || true)"
          echo "::notice title=APK embedded website assets::$embedded"
          for required in index.html offline-api.js offline-boot.js jszip.min.js; do
            if ! grep -qx "assets/www/$required" "$RUNNER_TEMP/apk-files.txt"; then
              echo "::error title=Offline APK payload::$required is missing from assets/www"
              grep '^assets/www/' "$RUNNER_TEMP/apk-files.txt" | head -n 50
              { echo "Missing APK payload file: assets/www/$required"; grep '^assets/www/' "$RUNNER_TEMP/apk-files.txt" | head -n 50; } >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          done
          if ! grep -Eq '^assets/www/project/local(\.html|/index\.html)$' "$RUNNER_TEMP/apk-files.txt"; then
            echo "::error title=Offline APK payload::generated local editor route is missing"
            grep '^assets/www/project/' "$RUNNER_TEMP/apk-files.txt" || true
            { echo 'Missing generated local editor route'; grep '^assets/www/project/' "$RUNNER_TEMP/apk-files.txt" || true; } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if ! grep -Eq '^assets/www/_next/static/.+\.js$' "$RUNNER_TEMP/apk-files.txt"; then
            next_files="$(grep '^assets/www/_next/' "$RUNNER_TEMP/apk-files.txt" | head -n 40 | paste -sd ',' - || true)"
            echo "::error title=Offline APK payload::Next.js JavaScript chunks are missing. _next entries: ${next_files:-none}"
            { echo 'Missing Next.js JavaScript chunks'; echo "_next entries: ${next_files:-none}"; } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo 'Offline web bundle verified: index, local API, JSZip, editor route, and Next.js chunks.'
          { echo '### Verified offline APK payload'; grep -E '^assets/www/(index.html|offline-api.js|offline-boot.js|jszip.min.js|project/local|_next/static/)' "$RUNNER_TEMP/apk-files.txt" | head -n 30; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: offline-android-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

  publish-apk-link:
    needs: build-apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: offline-android-release-apk
          path: release-assets
      - name: Publish direct APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: offline-site-${{ github.run_number }}-${{ github.run_attempt }}
          name: Offline Android APK ${{ github.run_number }}
          body: |
            APK built from the website archive downloaded from the supplied Railway URL by this workflow.
            The APK is signed with a temporary key created for this run. Future builds need a separate installation/uninstall.
          prerelease: true
          files: release-assets/app-release.apk
