plugins {
    id 'com.android.application'
}

android {
    namespace 'org.taisei_project.taisei'
    compileSdk 34

    defaultConfig {
        applicationId "org.taisei_project.taisei"
        minSdk 26
        targetSdk 34
        versionCode 10406
        versionName "1.4.6-android"

        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    signingConfigs {
        release {
            storeFile file("taisei-release.keystore")
            storePassword "taisei2026release"
            keyAlias "taisei-release"
            keyPassword "taisei2026release"
            storeType "PKCS12"
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    androidResources {
        noCompress 'zip', 'pak', 'ogg', 'opus', 'webp'
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

dependencies {
    implementation 'androidx.annotation:annotation:1.8.2'
}
