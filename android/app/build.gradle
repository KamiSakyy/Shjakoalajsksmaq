plugins {
    id 'com.android.application'
}

android {
    namespace 'org.taisei_project.taisei'
    compileSdk 34

    defaultConfig {
        applicationId "org.taisei_project.taisei"
        minSdk 24
        targetSdk 34
        versionCode 10406
        versionName "1.4.6-android"

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    androidResources {
        noCompress 'zip', 'pak', 'ogg', 'opus', 'webp'
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

dependencies {
    implementation 'androidx.annotation:annotation:1.8.2'
}
