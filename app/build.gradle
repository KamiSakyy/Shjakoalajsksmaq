plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ranobe.epub'
    compileSdk 37

    defaultConfig {
        applicationId 'com.ranobe.epub'
        minSdk 26
        targetSdk 37
        versionCode 2
        versionName '1.1.0'

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        vectorDrawables {
            useSupportLibrary true
        }
    }

    // Явное ABI-расщепление: собирается ТОЛЬКО arm64-v8a APK.
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a'
            universalApk false
        }
    }

    buildTypes {
        debug {
            // Installable build (signed with the automatic debug key, no secrets involved).
            debuggable true
        }
        release {
            // Release-артефакт подписан СТАНДАРТНЫМ публичным debug-ключом Android,
            // иначе APK физически не устанавливается на устройство. Это не production-подпись:
            // для Google Play нужен собственный keystore.
            signingConfig signingConfigs.debug
            // R8/ProGuard: минификация кода + удаление неиспользуемых ресурсов.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
        buildConfig false
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.core:core:1.19.1'
    implementation 'androidx.core:core-splashscreen:1.2.0'
    implementation 'androidx.activity:activity:1.13.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'com.google.android.material:material:1.14.0'

    testImplementation 'junit:junit:4.13.2'
    // Shadow of the android-framework org.json for plain-JVM unit tests.
    testImplementation 'org.json:json:20231013'
}
