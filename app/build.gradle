plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ranobe.epub'
    compileSdk 35

    defaultConfig {
        applicationId 'com.ranobe.epub'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        vectorDrawables {
            useSupportLibrary true
        }
        // Доставка только под 64-битные ARM-устройства (требование поставки).
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    // Явное ABI-расщепление: собирается ТОЛЬКО arm64-v8a APK.
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a'
            universalApk false
        }
    }

    buildTypes {
        debug {
            // Installable build (signed with the automatic debug key, no secrets involved).
            debuggable true
        }
        release {
            // Intentionally NO signingConfig: the release artifact is produced UNSIGNED,
            // exactly as requested ("без подписи"). Side-load the debug APK or sign manually.
            // R8/ProGuard: минификация кода + удаление неиспользуемых ресурсов.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
        buildConfig false
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'com.google.android.material:material:1.12.0'

    testImplementation 'junit:junit:4.13.2'
    // Shadow of the android-framework org.json for plain-JVM unit tests.
    testImplementation 'org.json:json:20231013'
}
